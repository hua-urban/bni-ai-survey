<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掃這個填問卷｜BNI 華都更</title>
<style>
:root{
  --red:#C8102E; --gold:#A8813A;
  --ground:#FBF9F6; --surface:#FFFFFF; --line:#E5DFD6;
  --ink:#1D1A17; --ink-2:#5C554B; --ink-3:#8B8377;
  --tint:#FDF3F4; --tint-line:#F2D9DD;
}
@media (prefers-color-scheme:dark){
  :root{ --red:#F0576F; --gold:#D9B877;
    --ground:#161412; --surface:#F4F1EC; --line:#37312B;
    --ink:#F2EEE8; --ink-2:#B4ACA1; --ink-3:#867E73;
    --tint:#251A1C; --tint-line:#43282D; }
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:5vh 4vw;line-height:1.7}
.card{text-align:center;max-width:min(92vw,720px)}
.kicker{display:inline-block;font-size:clamp(12px,1.6vw,15px);letter-spacing:.1em;color:var(--red);font-weight:700;
  background:var(--tint);border:1px solid var(--tint-line);border-radius:4px;padding:5px 14px;margin-bottom:clamp(14px,2.5vh,26px)}
h1{font-size:clamp(28px,5.5vw,54px);line-height:1.22;margin:0 0 clamp(8px,1.6vh,16px);letter-spacing:-.02em;font-weight:700}
.sub{font-size:clamp(15px,2.2vw,22px);color:var(--ink-2);margin:0 0 clamp(20px,4vh,40px)}
.sub b{color:var(--ink)}
.qr{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:clamp(14px,2.4vw,26px);display:inline-block;box-shadow:0 2px 24px rgba(0,0,0,.06)}
.qr img{display:block;width:clamp(220px,44vh,420px);height:auto;image-rendering:pixelated}
.url{margin:clamp(18px,3vh,30px) 0 0;font-size:clamp(14px,1.9vw,19px);color:var(--ink-2);word-break:break-all}
.url a{color:var(--red);text-decoration:none;font-weight:600}
.foot{margin:clamp(16px,2.6vh,26px) 0 0;font-size:clamp(13px,1.6vw,16px);color:var(--ink-3)}
</style>
</head>
<body>
<div class="card">
  <span class="kicker">BNI 華都更分會</span>
  <h1>掃這個，填 AI 課前問卷</h1>
  <p class="sub">15 題，<b>大約 3 分鐘</b>。填完你就是課程共創學員。</p>
  <div class="qr"><img src="./qr.png" alt="問卷 QR Code"></div>
  <p class="url">也可以直接開 <a href="./">hua-urban.com/bni-ai-survey</a></p>
  <p class="foot">沒到場的夥伴一樣可以填，連結丟大群就好。</p>
</div>
</body>
</html>
